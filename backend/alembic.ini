# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path-list to be prepended to sys.path in env.py.
# runs new migrations with the app directory in the path.
prepend_syspath = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to allow in the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow alembic to generate "empty" migrations
# (e.g. no instructions)
# write_empty = false

# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, paths must be separated by spaces.
version_locations = %(here)s/alembic/versions

# version_path_separator = :

# the execution options for the engine
# sqlalchemy.execution_options = {"schema": "some_schema"}

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
